<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nutrition Tracker</title>
  <meta name="description" content="Track daily food exchanges against a dietitian's meal plan.">
  <meta name="theme-color" content="#1f7a5a">
  <meta name="color-scheme" content="light only">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Nutrition">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Nutrition</h1>
  </header>

  <main id="app" class="container"></main>

  <nav class="tabbar" aria-label="Sections">
    <button class="tab-btn" data-action="nav" data-view="today">Today</button>
    <button class="tab-btn" data-action="nav" data-view="history">History</button>
    <button class="tab-btn" data-action="nav" data-view="settings">Settings</button>
  </nav>

  <dialog id="sheet" class="sheet" aria-label="Add food"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="foods.js"></script>
  <script src="ideas.js"></script>
  <script src="app.js"></script>
</body>
</html>
